name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
          - os: macos-latest
            features: ""
          - os: macos-latest
            features: metal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Initialize native sources
        run: |
          git submodule update --init --depth 1 diffusion-cpp-sys/vendor/stable-diffusion.cpp
          git -C diffusion-cpp-sys/vendor/stable-diffusion.cpp submodule update --init --depth 1 ggml
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.features }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
      - run: cargo test --locked --workspace --features "${{ matrix.features }}"
      - run: cargo run --locked --example system_info --features "${{ matrix.features }}"
